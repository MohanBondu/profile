  - slug: "microservices-migration"
    title: "Monolithic to Microservices Migration"
    description: "Migrated application from monolithic architecture to Microservices with Netflix Eureka and API Gateway"
    longDescription: |
      Migrated application from monolithic architecture to Microservices, utilizing Netflix Eureka for Service 
      Discovery and an API Gateway for centralized routing, thereby increasing fault tolerance by 90%.
      
      **Key Achievements:**
      - 90% increase in fault tolerance
      - Netflix Eureka for Service Discovery
      - API Gateway for centralized routing
      - WebFlux for reactive programming (80% reduction in server resource consumption)
    stack: ["Java", "Spring Boot", "WebFlux", "Netflix Eureka", "API Gateway", "Docker", "Kubernetes"]
    github: "https://github.com/mohanbondu/microservices-migration"
