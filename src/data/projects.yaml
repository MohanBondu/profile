projects:
  - slug: "system-security-resiliency-publisher"
    title: "System Security Resiliency Publisher"
    description: "Intelligent publication of resiliency score for cyber attacks on IT systems using Kali Linux recon tools and ExploitDB with GPT-3.5"
    longDescription: |
      Developed an initial PoC for intelligent publication of resiliency score for cyber attacks on IT systems. 
      The system uses data fetched from reconnaissance tools of Kali Linux and ExploitDB for generating prompts 
      to GPT-3.5 to generate exploitation scripts for underlying system vulnerabilities with an attack 
      compromise rate of 74%.
      
      **Key Features:**
      - Automated vulnerability discovery using Kali Linux recon tools
      - Integration with ExploitDB for exploit matching
      - LLM-powered exploitation script generation
      - Resiliency scoring for IT systems
    stack: ["Python", "LLM", "Bash", "ExploitDB", "Kali Linux"]
    github: "https://github.com/mohanbondu/security-resiliency-publisher"
    demo: "https://mohanbondu.github.io/security-resiliency-publisher"
    image: "/assets/projects/security-resiliency.jpg"
    featured: true
    status: "published"
    startDate: "2024-01"
  - slug: "change-risk-forecaster"
    title: "Change Risk Forecaster for IT Systems"
    description: "PoC to evaluate risk of code changes by analyzing network call traces across distributed systems"
    longDescription: |
      Created an initial Proof of Concept to evaluate the risk of code changes by analyzing network call traces 
      across distributed systems and tracking data propagation throughout the entire process. This framework 
      would help in process efficiency of release management process.
      
      **Key Features:**
      - Network call trace analysis across distributed systems
      - Data propagation tracking
      - Change risk assessment for release management
      - Process efficiency improvement
    stack: ["Angular", "Spring Boot", "FastAPI", "Deep Learning"]
    github: "https://github.com/mohanbondu/change-risk-forecaster"
    demo: "https://mohanbondu.github.io/change-risk-forecaster"
    image: "/assets/projects/change-risk-forecaster.jpg"
    featured: true
    status: "published"
    startDate: "2024-03"
